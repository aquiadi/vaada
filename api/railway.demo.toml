# The demo's API service: like railway.toml, but every deploy also seeds the personas and four deeds (skipped once seeded).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["sh -c 'alembic upgrade head && python -m vaada.seed'"]
startCommand = "sh -c \"uvicorn vaada.main:app_factory --factory --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips '*'\""
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
