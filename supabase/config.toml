# Local Supabase for `make dev`: Postgres, Auth and the mail catcher. Anything not set here is the CLI's default.
project_id = "vaada"

[api]
port = 54321

[db]
port = 54322
major_version = 17

# Vaada's schema is built by Alembic and its data by `make seed`, not by Supabase.
[db.seed]
enabled = false

[studio]
port = 54323

[local_smtp]
port = 54324

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/login", "http://127.0.0.1:5173/login"]
jwt_expiry = 3600
# Asymmetric keys, so the API verifies tokens against the public JWKS as it does in production.
signing_keys_path = "./signing_keys.json"
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 200

[auth.email]
enable_signup = true
# Sign-in is by a six-digit code, so there is no separate confirmation step.
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Vaada sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Your Vaada sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.sms]
enable_signup = false

# Off until GOOGLE_SIGNIN_ENABLED is turned on and an OAuth client exists (GO_LIVE.md).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true
